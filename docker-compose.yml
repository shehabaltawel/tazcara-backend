services:

  # ---- The Laravel application (PHP-FPM) ----
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tazcara_app
    working_dir: /var/www/html
    volumes:
      # Mount source code so file changes on your machine reflect inside
      # the container without rebuilding — essential for local development.
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-tazcara_db}
      DB_USERNAME: ${DB_USERNAME:-tazcara}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    depends_on:
      db:
        # "service_healthy" (not just "started") — waits for the actual
        # healthcheck below to pass, not just for the container to boot.
        condition: service_healthy
    networks:
      - tazcara_network

  # ---- Nginx web server ----
  nginx:
    image: nginx:stable-alpine
    container_name: tazcara_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - tazcara_network

  # ---- MySQL database ----
  db:
    image: mysql:8.0
    container_name: tazcara_db
    ports:
      # Host-facing MySQL port comes from .env (DB_PORT). The app container
      # still talks internally on 3306 (see app.environment), so a plain
      # "php artisan ..." on the host reaches the same database.
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tazcara_db}
      MYSQL_USER: ${DB_USERNAME:-tazcara}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      # Named volume = data survives container restarts/rebuilds.
      # Without this, every "docker-compose down" would wipe your database.
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tazcara_network

networks:
  tazcara_network:
    driver: bridge

volumes:
  dbdata:
