services:

  # ---- The Laravel application (PHP-FPM) ----
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tazcara_app
    working_dir: /var/www/html
    volumes:
      # Mount source code so file changes on your machine reflect inside
      # the container without rebuilding — essential for local development.
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        # "service_healthy" (not just "started") — waits for the actual
        # healthcheck below to pass, not just for the container to boot.
        condition: service_healthy
    networks:
      - tazcara_network

  # ---- Nginx web server ----
  nginx:
    image: nginx:stable-alpine
    container_name: tazcara_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - tazcara_network

  # ---- MySQL database ----
  db:
    image: mysql:8.0
    container_name: tazcara_db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      # Named volume = data survives container restarts/rebuilds.
      # Without this, every "docker-compose down" would wipe your database.
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tazcara_network

networks:
  tazcara_network:
    driver: bridge

volumes:
  dbdata:
